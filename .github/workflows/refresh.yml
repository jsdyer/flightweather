name: Flight Weather · Refresh reports
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/config.json
      - scripts/refresh.py
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: flightweather-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test collector and build contract
        run: python3 -m unittest discover -s tests -v
      - name: Retain forecast and observation evidence
        run: python3 scripts/refresh.py
      - name: Commit dated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: retain airport forecasts and observations"
          git pull --rebase origin main
          git push origin HEAD:main
